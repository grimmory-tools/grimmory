services:
  capability-probe:
    image: eclipse-temurin:25-jre@sha256:4ba7de2d5d53f8e2faad1f04e08b96719bd085c4b65fad0182b9f1a2cf94d259
    network_mode: none
    user: "0:${PROBE_GID:?Set PROBE_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./capability-sandbox:/probe:rw
    environment:
      PROBE_OWNER_UID: "${PROBE_OWNER_UID:?Set PROBE_OWNER_UID}"
      PROBE_OWNER_GID: "${PROBE_OWNER_GID:?Set PROBE_OWNER_GID}"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$PROBE_OWNER_UID:$$PROBE_OWNER_GID" in
          *[!0-9:]*|:*|*:) echo "Invalid target identity" >&2; exit 1 ;;
        esac
        caps=$$(awk '$$1 == "CapEff:" {print $$2}' /proc/self/status)
        [ "$$caps" = "0000000000000001" ] || { echo "Unexpected effective capabilities: $$caps" >&2; exit 1; }
        [ ! -e /probe/source.epub ] && [ ! -e /probe/candidate.epub ] || { echo "Probe files already exist" >&2; exit 1; }
        trap 'rm -f /probe/source.epub /probe/candidate.epub' EXIT
        printf 'synthetic original\n' > /probe/source.epub
        printf 'synthetic replacement\n' > /probe/candidate.epub
        chown "$$PROBE_OWNER_UID:$$PROBE_OWNER_GID" /probe/source.epub
        chown --reference=/probe/source.epub /probe/candidate.epub
        expected="$$PROBE_OWNER_UID:$$PROBE_OWNER_GID"
        [ "$$(stat -c '%u:%g' /probe/source.epub)" = "$$expected" ]
        [ "$$(stat -c '%u:%g' /probe/candidate.epub)" = "$$expected" ]
        mv /probe/candidate.epub /probe/source.epub
        [ "$$(stat -c '%u:%g' /probe/source.epub)" = "$$expected" ]
        [ "$$(cat /probe/source.epub)" = "synthetic replacement" ]
        echo '{"capChownOnly":true,"ownershipPreserved":true}'
    restart: "no"
