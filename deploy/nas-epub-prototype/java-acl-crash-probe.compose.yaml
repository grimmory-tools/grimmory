services:
  java-acl-crash-probe:
    image: eclipse-temurin:25-jre@sha256:4ba7de2d5d53f8e2faad1f04e08b96719bd085c4b65fad0182b9f1a2cf94d259
    network_mode: none
    user: "0:${PROBE_GID:?Set PROBE_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=384m
    volumes:
      - ./sandbox:/sandbox:rw
      - ./backend.jar:/opt/grimmory/backend.jar:ro
      - /usr/syno/bin/synoacltool:/opt/synology/synoacltool:ro
      - /usr/lib/libsynocore.so.7:/opt/synology/lib/libsynocore.so.7:ro
      - /usr/lib/libsynoacl.so:/opt/synology/lib/libsynoacl.so:ro
      - /usr/lib/libicui18n.so.64.2:/opt/synology/lib/libicui18n.so.64:ro
      - /usr/lib/libicuuc.so.64.2:/opt/synology/lib/libicuuc.so.64:ro
      - /usr/lib/libicudata.so.64.2:/opt/synology/lib/libicudata.so.64:ro
      - /usr/lib/libattr.so.1.1.0:/opt/synology/lib/libattr.so.1:ro
      - /usr/lib/libcrypt.so.1:/opt/synology/lib/libcrypt.so.1:ro
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
        caps=$$(awk '$$1 == "CapEff:" {print $$2}' /proc/self/status)
        [ "$$caps" = "0000000000000001" ] || { echo 'Unexpected effective capabilities' >&2; exit 1; }
        for input in /sandbox/first.epub /sandbox/second.epub; do
          [ -f "$$input" ] && [ ! -L "$$input" ] || { echo 'Invalid synthetic input' >&2; exit 1; }
          hash=$$(sha256sum "$$input" | cut -d ' ' -f 1)
          [ "$$hash" = '80693f33cf39d534264ae50eff72bbeb335fb2c1f39f4ec6049ad7245cc6b480' ] || {
            echo 'Unexpected synthetic input hash' >&2; exit 1;
          }
        done
        chown 1035:101 /sandbox/second.epub
        run_probe() {
          java --enable-preview -Xmx256m \
            -Dloader.main=org.booklore.service.metadata.writer.NasSynologySyntheticCrashProbe \
            -cp /opt/grimmory/backend.jar org.springframework.boot.loader.launch.PropertiesLauncher "$$1"
        }
        set +e
        run_probe crash
        code=$$?
        set -e
        [ "$$code" -eq 77 ] || { echo "Unexpected crash probe exit: $$code" >&2; exit 1; }
        run_probe recover
    restart: "no"
