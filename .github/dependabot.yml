version: 2
updates:
  # Backend – Gradle (Java / Spring)
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      twelvemonkeys:
        patterns:
          - "com.twelvemonkeys.imageio:*"
      mapstruct:
        patterns:
          - "org.mapstruct:*"
      jaxb:
        patterns:
          - "jakarta.xml.bind:*"
          - "org.glassfish.jaxb:*"
      compress:
        patterns:
          - "org.apache.commons:commons-compress"
          - "org.tukaani:xz"

  # JavaScript – pnpm workspace (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      lucide:
        patterns:
          - "lucide-static"
          - "@lucide/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "angular-eslint"
      oxlint:
        patterns:
          - "oxlint"
          - "@oxlint/*"
          - "eslint-plugin-oxlint"
          - "oxlint-tsgolint"
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      openng:
        patterns:
          - "@openng/*"
      embedpdf:
        patterns:
          - "@embedpdf/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-config-*"
      stomp:
        patterns:
          - "@stomp/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
      artifact:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      docker:
        patterns:
          - "docker/*"
      pnpm:
        patterns:
          - "pnpm/*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
