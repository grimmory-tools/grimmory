version: 2
updates:
  # Backend – Gradle (Java / Spring)
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      twelvemonkeys:
        patterns:
          - "com.twelvemonkeys.imageio:*"
      mapstruct:
        patterns:
          - "org.mapstruct:*"

  # JavaScript – pnpm workspace (frontend + release tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "03:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      lucide:
        patterns:
          - "lucide-static"
          - "@lucide/*"
      release-tooling:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "angular-eslint"
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      openng:
        patterns:
          - "@openng/*"
      embedpdf:
        patterns:
          - "@embedpdf/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
      artifact:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
