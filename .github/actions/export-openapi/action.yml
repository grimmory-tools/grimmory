name: Export OpenAPI
description: Check out a ref, set up the backend toolchain, and export grimmory-openapi.json.

inputs:
  app_version:
    description: Application version string to embed into the exported OpenAPI document.
    required: true
  checkout_ref:
    description: Git ref or SHA to export from.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        ref: ${{ inputs.checkout_ref }}

    - name: Install just
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: just

    - name: Set Up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: |
          **/*.gradle*
          **/gradle.lockfile
          **/settings.gradle*
          **/gradle/wrapper/gradle-wrapper.properties

    - name: Export OpenAPI JSON
      shell: bash
      env:
        APP_VERSION: ${{ inputs.app_version }}
      run: just api openapi-export
