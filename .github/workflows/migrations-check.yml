name: Reusable - Flyway Migration Check

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "The ref to check out before diffing migrations"
        required: true
        type: string
      base_ref:
        description: "The base ref for comparison"
        required: true
        type: string
      head_ref:
        description: "The head ref for comparison"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-for-migrations:
    name: Check for DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Check Migration Immutability and Ordering
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          MIGRATION_DIR: backend/src/main/resources/db/migration
        run: |
          set -euo pipefail

          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "Invalid base_ref (all zeroes)." >&2
            exit 1
          fi

          # 1. Existing versioned migrations cannot be modified, deleted, or renamed
          changed=$(git diff --name-status --diff-filter=MDR "${BASE_REF}...${HEAD_REF}" -- "${MIGRATION_DIR}/V*.sql")
          if [ -n "$changed" ]; then
            echo "❌ Existing migrations cannot be modified, deleted, or renamed:"
            echo "$changed"
            exit 1
          fi

          # 2. Newly added migrations must have unique versions higher than base
          added=$(git diff --name-only --diff-filter=A "${BASE_REF}...${HEAD_REF}" -- "${MIGRATION_DIR}/V*.sql")
          if [ -z "$added" ]; then
            echo "No new migrations."
            exit 0
          fi

          max_base=$(git ls-tree --name-only "${BASE_REF}" "${MIGRATION_DIR}/" \
            | sed -n 's|^.*/V\([0-9]\+\)__.*\.sql$|\1|p' | sort -n | tail -1)
          max_base=${max_base:-0}

          versions=$(printf '%s\n' "$added" | sed -n 's|^.*/V\([0-9]\+\)__.*\.sql$|\1|p')
          dups=$(printf '%s\n' "$versions" | sort -n | uniq -d)
          if [ -n "$dups" ]; then
            echo "❌ Duplicate migration version(s): $dups"
            exit 1
          fi

          for file in $added; do
            version=$(basename "$file" | sed -n 's|^V\([0-9]\+\)__.*\.sql$|\1|p')
            if [ -z "$version" ] || [ "$version" -le "$max_base" ]; then
              echo "❌ $file must have a version higher than V${max_base}."
              exit 1
            fi
          done

          echo "✅ Flyway migration check passed."
