name: Sync i18n Translations

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    name: Synchronize with Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          localization_branch_name: chore/-/sync-translations

          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from crowdin'
          pull_request_body: >
            ## Description

            updates the i18n files from crowdin automatically
          pull_request_base_branch_name: develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
