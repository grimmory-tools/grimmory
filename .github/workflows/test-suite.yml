name: Reusable - Test Suite

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'The ref to check out before running tests'
        required: true
        type: string
      publish_test_results:
        description: 'Whether to publish test results directly from this workflow'
        required: false
        type: boolean
        default: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just

      - name: Set Up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.lockfile
            **/settings.gradle*
            **/gradle/wrapper/gradle-wrapper.properties

      # Needed for NightCompress
      - name: Install libarchive
        run: |
          sudo apt-get update 
          sudo apt-get install libarchive-dev --yes

          # Place libarchive somewhere that java looks for it.
          sudo mkdir -p /usr/java/packages/lib/
          sudo cp /usr/lib/x86_64-linux-gnu/libarchive.* /usr/java/packages/lib/

      - name: Execute Backend Tests
        id: backend_tests
        run: |
          echo "Running backend tests..."
          just api test
        continue-on-error: true

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: backend/build/test-results/**/*.xml
          check_name: Backend Test Results

      - name: Upload Backend Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 30

      - name: Validate Backend Test Results
        if: steps.backend_tests.outcome == 'failure'
        run: |
          echo "❌ Backend tests failed"
          exit 1

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just

      - name: Set Up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Install Frontend Dependencies
        run: just ui install-ci

      - name: Audit Frontend Dependencies
        run: just ui audit-ci

      - name: Validate Dependency Tree
        run: just ui deps

      - name: Execute Frontend Tests
        id: frontend_tests
        run: |
          echo "Running frontend tests..."
          just ui test
        continue-on-error: true

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: frontend/test-results/vitest-results.xml
          check_name: Frontend Test Results

      - name: Upload Frontend Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/vitest-results.xml
          retention-days: 30

      - name: Validate Frontend Test Results
        if: steps.frontend_tests.outcome == 'failure'
        run: |
          echo "❌ Frontend tests failed"
          exit 1
