name: Reusable - Test Suite

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'The ref to check out before running tests'
        required: true
        type: string
      publish_test_results:
        description: 'Whether to publish test results directly from this workflow'
        required: false
        type: boolean
        default: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just

      - name: Set Up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.lockfile
            **/settings.gradle*
            **/gradle/wrapper/gradle-wrapper.properties

      # Needed for NightCompress
      - name: Install libarchive
        run: |
          sudo apt-get update 
          sudo apt-get install libarchive-dev --yes

          # Place libarchive somewhere that java looks for it.
          sudo mkdir -p /usr/java/packages/lib/
          sudo cp /usr/lib/x86_64-linux-gnu/libarchive.* /usr/java/packages/lib/

      - name: Execute Backend Tests
        id: backend_tests
        run: |
          echo "Running backend tests..."
          just api test
        continue-on-error: true

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: backend/build/test-results/**/*.xml
          check_name: Backend Test Results

      - name: Upload Backend Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 30

      - name: Validate Backend Test Results
        if: steps.backend_tests.outcome == 'failure'
        run: |
          echo "❌ Backend tests failed"
          exit 1

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc

      - name: Install Frontend Dependencies
        run: just ui install-ci

      - name: Audit Frontend Dependencies
        run: just ui audit-ci

      - name: Validate Dependency Tree
        run: just ui deps

      - name: Execute Frontend Tests
        id: frontend_tests
        run: |
          echo "Running frontend tests..."
          just ui test
        continue-on-error: true

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: frontend/test-results/vitest-results.xml
          check_name: Frontend Test Results

      - name: Upload Frontend Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/vitest-results.xml
          retention-days: 30

      - name: Validate Frontend Test Results
        if: steps.frontend_tests.outcome == 'failure'
        run: |
          echo "❌ Frontend tests failed"
          exit 1
