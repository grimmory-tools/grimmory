name: Reusable - Test Suite

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'The ref to check out before running tests'
        required: true
        type: string
      publish_test_results:
        description: 'Whether to publish test results directly from this workflow'
        required: false
        type: boolean
        default: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just

      - name: Set Up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.lockfile
            **/settings.gradle*
            **/gradle/wrapper/gradle-wrapper.properties

      - name: Execute Backend Unit Tests
        id: backend_tests
        run: |
          echo "Running backend unit tests..."
          just api test
        continue-on-error: true

      - name: Publish Backend Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: backend/build/test-results/test/**/*.xml
          check_name: Backend Unit Test Results

      - name: Upload Backend Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          retention-days: 30

      - name: Validate Backend Unit Test Results
        if: steps.backend_tests.outcome == 'failure'
        run: |
          echo "❌ Backend unit tests failed"
          exit 1

  database-tests:
    name: Database Tests (${{ matrix.database }} ${{ matrix.version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mariadb
            version: '11.4'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just

      - name: Set Up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle.lockfile
            **/settings.gradle*
            **/gradle/wrapper/gradle-wrapper.properties

      - name: Execute Database Tests
        id: database_tests
        env:
          TEST_DATABASE: ${{ matrix.database }}
          TEST_DATABASE_VERSION: ${{ matrix.version }}
        run: |
          echo "Running database tests against ${TEST_DATABASE} ${TEST_DATABASE_VERSION}..."
          just api test-database "${TEST_DATABASE}" "${TEST_DATABASE_VERSION}"
        continue-on-error: true

      - name: Publish Database Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: backend/build/test-results/databaseTest/**/*.xml
          check_name: Database Test Results (${{ matrix.database }} ${{ matrix.version }})

      - name: Upload Database Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: database-test-reports-${{ matrix.database }}-${{ matrix.version }}
          path: |
            backend/build/reports/tests/databaseTest/
            backend/build/test-results/databaseTest/
          retention-days: 30

      - name: Validate Database Test Results
        if: steps.database_tests.outcome == 'failure'
        run: |
          echo "❌ Database tests failed"
          exit 1

  backend-tests:
    name: Backend Tests
    needs: [backend-unit-tests, database-tests]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Verify All Backend Test Jobs Passed
        env:
          UNIT_RESULT: ${{ needs.backend-unit-tests.result }}
          DB_RESULT: ${{ needs.database-tests.result }}
        run: |
          echo "Backend Unit Tests: ${UNIT_RESULT}"
          echo "Database Tests: ${DB_RESULT}"
          if [ "${UNIT_RESULT}" != "success" ] || [ "${DB_RESULT}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ Backend tests passed"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Install just
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just

      - name: Set Up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/develop' }}
          install: false

      - name: Install Frontend Dependencies
        run: just ui install-ci

      - name: Audit Frontend Dependencies
        run: just ui audit-ci

      - name: Validate Dependency Tree
        run: just ui deps

      - name: Execute Frontend Tests
        id: frontend_tests
        run: |
          echo "Running frontend tests..."
          just ui test
        continue-on-error: true

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: ${{ always() && inputs.publish_test_results }}
        with:
          files: frontend/test-results/vitest-results.xml
          check_name: Frontend Test Results

      - name: Upload Frontend Test Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/vitest-results.xml
          retention-days: 30

      - name: Validate Frontend Test Results
        if: steps.frontend_tests.outcome == 'failure'
        run: |
          echo "❌ Frontend tests failed"
          exit 1
