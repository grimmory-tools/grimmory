@if (showImage() && preview()) {
  <p-image
    styleClass="block h-full w-full"
    [imageClass]="imageClass()"
    [src]="src() ?? ''"
    [alt]="alt()"
    [loading]="loading()"
    appendTo="body"
    [preview]="true"
    (onImageError)="onError()"
  />
} @else if (showImage()) {
  <img
    (load)="markReady()"
    (error)="onError()"
    [class]="imageClass()"
    [src]="src() ?? ''"
    [alt]="alt()"
    [attr.loading]="loading()"
    decoding="async"
  />
} @else if (placeholder() === 'initials') {
  <div
    class="placeholder flex h-full w-full items-center justify-center overflow-hidden rounded-[inherit] bg-[oklch(from_var(--color-primary-100)_0.95_calc(c*0.6)_h)] dark:bg-[oklch(from_var(--color-primary-900)_0.31_calc(c*0.33)_h)]"
  >
    <span class="text-[30cqw] font-semibold leading-none tracking-[0.02em] text-primary-800 dark:text-primary-200">
      {{ initials() }}
    </span>
  </div>
} @else {
  <div
    class="placeholder group flex aspect-[5/7] h-full w-full flex-col justify-end overflow-hidden rounded-[inherit] p-2 text-left data-[size=md]:p-3 data-[size=lg]:p-3 bg-[oklch(from_var(--color-primary-100)_0.95_calc(c*0.6)_h)] dark:bg-[oklch(from_var(--color-primary-900)_0.31_calc(c*0.33)_h)]"
    [attr.data-size]="size()"
  >
    <div
      class="@max-[80px]:hidden transition-transform duration-300 ease-glide group-hover/lift:-translate-y-7 group-has-[:focus-visible]/lift:-translate-y-7 group-[.cover-lifted]/lift:-translate-y-7 motion-reduce:transition-none text-primary-800 dark:text-primary-200"
    >
      @if (titleOnly()) {
        <div class="placeholder-title line-clamp-3 max-w-full overflow-hidden break-words font-normal leading-[1.25] font-cover-serif text-[14px] group-data-[size=md]:text-[17px] group-data-[size=lg]:text-[19px]">
          {{ title() }}
        </div>
      } @else {
        <div class="placeholder-title line-clamp-3 max-w-full overflow-hidden break-words font-normal leading-[1.25] font-cover-serif text-[12px] group-data-[size=md]:text-[15px] group-data-[size=lg]:text-[17px]">
          {{ title() }}
        </div>
        <div class="placeholder-author mt-1 line-clamp-1 max-w-full overflow-hidden break-words uppercase tracking-[0.08em] opacity-70 font-cover-serif text-[8.5px] group-data-[size=md]:mt-1.5 group-data-[size=md]:text-[9.5px] group-data-[size=lg]:text-[11px]">
          {{ authorsLabel() }}
        </div>
      }
    </div>
  </div>
}
