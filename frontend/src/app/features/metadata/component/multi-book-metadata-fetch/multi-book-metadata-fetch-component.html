<div class="multi-book-fetch-container">
  <div class="panel-header">
    <div class="header-icon-wrapper">
      <i class="pi pi-sync header-icon"></i>
    </div>
    <div class="header-text">
      <h2 class="panel-title">{{ 'metadataFetch.title' | transloco }}</h2>
      @if (isLibraryRefresh) {
        <p class="panel-description">{{ 'metadataFetch.libraryDescription' | transloco }}</p>
      } @else {
        <p class="panel-description">{{ (bookIds.length === 1 ? 'fileMover.selectedBook' : 'fileMover.selectedBooks') | transloco: {count: bookIds.length} }}</p>
      }
    </div>
    <p-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (click)="dialogRef.close()"
      class="close-button" />
  </div>

  <div class="dialog-content">
    <app-metadata-fetch-options
      [dialogData]="{ bookIds: bookIds, libraryId: libraryId, metadataRefreshType: metadataRefreshType }" />
  </div>
</div>
