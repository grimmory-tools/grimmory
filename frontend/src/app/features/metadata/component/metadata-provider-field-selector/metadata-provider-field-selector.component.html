<ng-container *transloco="let t; prefix: 'settingsMeta.fieldSelector'">
  <div class="settings-card">
    <div class="section-header">
      <h3 class="section-title">
        <i class="pi pi-list"></i>
        {{ t('sectionTitle') }}
      </h3>
      <p class="section-description">
        {{ t('sectionDesc') }}
      </p>
    </div>

    <div class="section-body">
      <div class="provider-groups-container">
        @for (group of providerGroups(); track group.label) {
          <div class="provider-group">
            <div class="group-header">
              <span class="group-icon pi pi-database"></span>
              <h4 class="group-label">{{ group.label }}</h4>
            </div>
            <div class="field-list">
              @for (field of group.fields; track field.name) {
                <div class="field-item">
                  <p-toggleswitch
                    [inputId]="field.name"
                    [ngModel]="selectedFields.includes(field.name)"
                    (ngModelChange)="toggleField(field.name, $event)">
                  </p-toggleswitch>
                  <label [for]="field.name">{{ field.label }}</label>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</ng-container>
