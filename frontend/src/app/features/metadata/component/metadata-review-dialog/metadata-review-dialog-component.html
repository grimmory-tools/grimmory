<div class="metadata-review-container">
  <div class="panel-header">
    <div class="header-icon-wrapper">
      <i class="pi pi-pencil header-icon"></i>
    </div>
    <div class="header-text">
      <h2 class="panel-title">{{ 'metadataReview.title' | transloco }}</h2>
      <p class="panel-description">{{ 'metadataReview.description' | transloco }}</p>
    </div>
    <p-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (click)="close()"
      class="close-button" />
  </div>

  @if (!loading()) {
    <div class="dialog-content">
      @if (currentProposal?.metadataJson; as proposed) {
        <app-metadata-picker
          [fetchedMetadata]="proposed"
          [book]="currentBook()"
          (goBack)="close()"
          [reviewMode]="true" />
      }
    </div>

    <div class="dialog-footer">
      <div class="footer-info">
        <div class="progress-group" [pTooltip]="'metadataReview.progressTooltip' | transloco: {current: currentIndex() + 1, total: proposals().length, percent: ((currentIndex() + 1) / proposals().length * 100) | number: '1.0-0'}" tooltipPosition="top">
          <p-progressBar
            [value]="((currentIndex() + 1) / proposals().length) * 100"
            class="progress-bar"
            showValue="false" />
          <span class="progress-text">
            {{ 'metadataReview.bookProgress' | transloco: {current: currentIndex() + 1, total: proposals().length} }}
          </span>
        </div>
      </div>

      <div class="footer-actions">
        <p-button
          [label]="'common.close' | transloco"
          icon="pi pi-times-circle"
          severity="secondary"
          [outlined]="true"
          (click)="close()" />

        <p-divider layout="vertical"/>

        <p-button
          [label]="'metadataReview.lockAll' | transloco"
          icon="pi pi-lock"
          severity="warn"
          [outlined]="true"
          (click)="lockAllMetadata()" />

        <p-button
          [label]="'metadataReview.unlockAll' | transloco"
          icon="pi pi-lock-open"
          severity="success"
          [outlined]="true"
          (click)="unlockAllMetadata()" />

        <p-divider layout="vertical"/>

        <p-button
          [label]="'metadataReview.acceptSave' | transloco"
          icon="pi pi-check-circle"
          iconPos="right"
          severity="success"
          [outlined]="true"
          (click)="onSave()" />

        <p-divider layout="vertical"/>

        <p-button
          [label]="(isLast ? 'metadataReview.finishClose' : 'common.next') | transloco"
          [icon]="isLast ? 'pi pi-check-circle' : 'pi pi-angle-right'"
          iconPos="right"
          severity="info"
          [outlined]="true"
          (click)="onNext()" />
      </div>
    </div>
  } @else {
    <div class="dialog-content loading-state">
      <p-progressSpinner class="spinner" strokeWidth="4" />
    </div>
  }
</div>
