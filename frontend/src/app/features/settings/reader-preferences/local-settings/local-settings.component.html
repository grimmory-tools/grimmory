<ng-container *transloco="let t; prefix: 'settingsNaming.localSettings'">
  <div class="local-settings-container">
    <div class="settings-header">
      <h2 class="settings-title">
        <i class="pi pi-home"></i>
        {{ t('title') }}
      </h2>
      <p class="settings-description">
        {{ t('description') }}
      </p>
    </div>

    <div class="settings-card">
      <div class="section-header">
        <h3 class="section-title">
          <i class="pi pi-database"></i>
          {{ t('cacheTitle') }}
        </h3>
        <p class="section-description">
          {{ t('cacheDescription') }}
        </p>
      </div>

      <div class="settings-content">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">{{ t('enableCache') }}</span>
            <span class="setting-description">{{ t('enableCacheDescription') }}</span>
          </div>
          <div class="setting-control">
            <p-checkbox [(ngModel)]="settings.cacheStorageEnabled" [binary]="true" (onChange)="onSettingChange()" />
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">{{ t('usageTitle') }}</span>
            <span class="setting-description">{{ t('usageDescription') }}</span>
          </div>
          <div class="setting-control action-buttons">
            <span class="setting-value">{{ cacheStorageUsageMb() | number: '1.2-2' }} MB</span>
            <p-button type="button" [label]="t('refresh')" icon="pi pi-refresh" severity="secondary" [outlined]="true"
              [disabled]="isLoadingCacheStorageUsage()" [loading]="isLoadingCacheStorageUsage()" (onClick)="loadCacheStorageUsage()" />
          </div>
        </div>

        <div class="setting-item action-item">
          <div class="setting-info">
            <span class="setting-label">{{ t('clearTitle') }}</span>
            <span class="setting-description">{{ t('clearDescription') }}</span>
          </div>
          <div class="setting-control">
            <p-button type="button" [label]="t('clear')" icon="pi pi-trash" severity="danger" [outlined]="true"
              [disabled]="isClearingCacheStorage()" [loading]="isClearingCacheStorage()" (onClick)="clearCacheStorage()" />
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
