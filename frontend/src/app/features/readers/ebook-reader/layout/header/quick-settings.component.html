<ng-container *transloco="let t; prefix: 'readerEbook.quickSettings'">
<div class="quick-settings-overlay" role="button" tabindex="0" (click)="onOverlayClick()" (keydown.enter)="onOverlayClick()">
  <div class="quick-settings-panel" tabindex="0" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
    <div class="pointer"></div>
    <div class="panel-body">
      <!-- Dark Mode -->
      <div class="control">
        <span>{{ t('darkMode') }}</span>
        <div class="control-right">
          <span class="mode-icon sun" [class.active]="!isDarkMode">&#9728;&#65039;</span>
          <button type="button" class="switch" [class.active]="isDarkMode" (click)="toggleDarkMode()">
            <span class="slider"></span>
          </button>
          <span class="mode-icon moon" [class.active]="isDarkMode">&#127769;</span>
        </div>
      </div>

      <!-- Font Size -->
      <div class="control">
        <span>{{ t('fontSize') }}</span>
        <div class="control-right">
          <div class="stepper">
            <button type="button" (click)="decreaseFontSize()">&#8722;</button>
            <span>{{ state.fontSize }}%</span>
            <button type="button" (click)="increaseFontSize()">+</button>
          </div>
        </div>
      </div>

      <!-- Line Spacing -->
      <div class="control">
        <span>{{ t('lineSpacing') }}</span>
        <div class="control-right">
          <div class="stepper">
            <button type="button" (click)="decreaseLineHeight()">&#8722;</button>
            <span>{{ state.lineHeight | number:'1.1-1' }}</span>
            <button type="button" (click)="increaseLineHeight()">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-footer">
      <button type="button" class="more-settings-btn" (click)="onOpenFullSettings()">
        <app-reader-icon name="settings" [size]="16" />
        <span>{{ t('moreSettings') }}</span>
      </button>
    </div>
  </div>
</div>
</ng-container>
