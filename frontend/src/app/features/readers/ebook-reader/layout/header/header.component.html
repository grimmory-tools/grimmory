<ng-container *transloco="let t; prefix: 'readerEbook.header'">
<div class="reader-header" [class.is-visible]="forceVisible()" [style.background]="theme().bg" [style.color]="theme().fg"
  (mouseenter)="hoverChange.emit(true)" (mouseleave)="hoverChange.emit(false)">
  <div class="header-left">
    <button type="button" class="icon-btn" (click)="onShowChapters()" [title]="t('chapters')">
      <app-reader-icon name="menu" [size]="20" />
    </button>
    <button type="button" class="icon-btn" (click)="onCreateBookmark()" [title]="isCurrentCfiBookmarked() ? t('removeBookmark') : t('addBookmark')" [class.active]="isCurrentCfiBookmarked()">
      <app-reader-icon name="bookmark" />
    </button>
    <button type="button" class="icon-btn" (click)="onOpenSearch()" [title]="t('search')">
      <app-reader-icon name="search" />
    </button>
  </div>
  <span class="chapter-title">{{ bookTitle() }}</span>
  <div class="header-right">
    <button type="button" class="icon-btn desktop-only" (click)="onOpenNotes()" [title]="t('notes')">
      <app-reader-icon name="note" />
    </button>
    <button type="button" class="icon-btn desktop-only" (click)="onToggleFullscreen()" [title]="isFullscreen() ? t('exitFullscreen') : t('fullscreen')">
      <app-reader-icon [name]="isFullscreen() ? 'fullscreen-exit' : 'fullscreen'" [size]="20" />
    </button>
    <button type="button" class="icon-btn desktop-only" (click)="onShowHelp()" [title]="t('keyboardShortcuts')">
      <app-reader-icon name="help" [size]="20" />
    </button>
    <div class="overflow-menu mobile-only">
      <button type="button" class="icon-btn" (click)="overflowOpen = !overflowOpen; $event.stopPropagation()" [title]="t('more')">
        <app-reader-icon name="dots-vertical" [size]="20" />
      </button>
      @if (overflowOpen) {
        <div class="overflow-backdrop" role="button" tabindex="0" (click)="overflowOpen = false" (keydown.enter)="overflowOpen = false"></div>
        <div class="overflow-dropdown" [style.background]="theme().bg" [style.color]="theme().fg">
          <button type="button" class="overflow-item" (click)="onOpenNotes(); overflowOpen = false">
            <app-reader-icon name="note" [size]="18" />
            <span>{{ t('notes') }}</span>
          </button>
          <button type="button" class="overflow-item" (click)="onToggleFullscreen(); overflowOpen = false">
            <app-reader-icon [name]="isFullscreen() ? 'fullscreen-exit' : 'fullscreen'" [size]="18" />
            <span>{{ isFullscreen() ? t('exitFullscreen') : t('fullscreen') }}</span>
          </button>
          <button type="button" class="overflow-item" (click)="onShowHelp(); overflowOpen = false">
            <app-reader-icon name="help" [size]="18" />
            <span>{{ t('keyboardShortcuts') }}</span>
          </button>
        </div>
      }
    </div>
    <button type="button" class="icon-btn" (click)="onShowControls()" [title]="t('settings')">
      <app-reader-icon name="settings" />
    </button>
    <button type="button" class="icon-btn close-btn" (click)="onClose(); $event.stopPropagation()" [title]="t('closeReader')">
      <app-reader-icon name="close" />
    </button>
  </div>
</div>
</ng-container>
